<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FX AVIATOR GOD - PREMIUM MASTER ADMIN</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            background-color: #030712 !important; 
            overflow-x: hidden;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        .cyber-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(6, 182, 212, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .cyber-card:hover {
            border-color: rgba(6, 182, 212, 0.6);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.15);
        }

        /* Status Colors & Glows */
        .status-active {
            color: #00FF66 !important;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
        }
        .status-expired {
            color: #FF0055 !important;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: scale(0.95); }
            50% { opacity: 1; transform: scale(1.15); }
        }
        .pulse-dot { animation: pulseGlow 1.5s infinite ease-in-out; }

        /* Toast Popup System */
        .toast-popup {
            animation: slideIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
    </style>
</head>
<body class="text-gray-100 p-4 md:p-8 min-h-screen relative">

    <div id="toastDock" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-xs pointer-events-none px-4"></div>

    <div class="max-w-6xl mx-auto space-y-6">
        
        <header class="cyber-card p-6 border-l-4 border-l-cyan-500 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-black tracking-wider text-cyan-400 flex items-center gap-2">
                    <i data-lucide="terminal" class="w-6 h-6"></i> FX ENGINE MASTER PANEL
                </h1>
                <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest font-sans font-semibold">
                    Live Monitor • Instant Dynamic Validity Modifications • 0% Lag
                </p>
            </div>

            <div class="grid grid-cols-3 gap-4 w-full md:w-auto font-mono text-center">
                <div class="bg-gray-900/60 p-2.5 rounded-lg border border-gray-800">
                    <span class="text-[10px] text-gray-400 block">TOTAL</span>
                    <span id="statTotal" class="text-lg font-bold text-cyan-400">0</span>
                </div>
                <div class="bg-gray-900/60 p-2.5 rounded-lg border border-gray-800">
                    <span class="text-[10px] text-gray-400 block">ACTIVE</span>
                    <span id="statActive" class="text-lg font-bold text-green-400">0</span>
                </div>
                <div class="bg-gray-900/60 p-2.5 rounded-lg border border-gray-800">
                    <span class="text-[10px] text-gray-400 block">EXPIRED</span>
                    <span id="statExpired" class="text-lg font-bold text-red-500">0</span>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="cyber-card p-5 h-fit space-y-4">
                <h2 class="text-xs font-bold text-cyan-400 tracking-wider uppercase flex items-center gap-1.5 border-b border-gray-800 pb-2">
                    <i data-lucide="shield-plus" class="w-4 h-4"></i> Inject Authorization
                </h2>
                <form id="injectionForm" class="space-y-4 font-sans">
                    <div class="space-y-1">
                        <label class="text-[11px] font-mono font-bold text-gray-400 uppercase">Device Fingerprint ID</label>
                        <input type="text" id="targetId" required placeholder="Paste FXA-XXXX-XXXX ID" class="w-full bg-gray-900/90 border border-gray-800 focus:border-cyan-500 rounded-lg px-3 py-2 text-sm text-cyan-400 font-mono focus:outline-none">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2">
                        <div class="space-y-1">
                            <label class="text-[11px] font-mono font-bold text-gray-400 uppercase">Validity Value</label>
                            <input type="number" id="formValidityValue" required placeholder="E.g. 10" min="1" class="w-full bg-gray-900/90 border border-gray-800 focus:border-cyan-500 rounded-lg px-3 py-2 text-sm text-cyan-400 font-mono focus:outline-none">
                        </div>
                        <div class="space-y-1">
                            <label class="text-[11px] font-mono font-bold text-gray-400 uppercase">Select Type</label>
                            <select id="formValidityUnit" class="w-full bg-gray-900/90 border border-gray-800 focus:border-cyan-500 rounded-lg px-3 py-2 text-sm text-gray-300 focus:outline-none font-mono">
                                <option value="mins">Minutes</option>
                                <option value="hrs" selected>Hours</option>
                                <option value="days">Days</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-mono font-bold py-2.5 rounded-lg text-xs tracking-wider uppercase transition-colors flex items-center justify-center gap-2">
                        <i data-lucide="cpu" class="w-4 h-4"></i> Deploy Authorization
                    </button>
                </form>
            </div>

            <div class="cyber-card p-5 lg:col-span-2 flex flex-col min-h-[450px]">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 border-b border-gray-800 pb-3 mb-4">
                    <h2 class="text-xs font-bold text-cyan-400 tracking-wider uppercase flex items-center gap-1.5 self-start sm:self-auto">
                        <i data-lucide="activity" class="w-4 h-4"></i> Live Registry Stream
                    </h2>
                    <div class="flex items-center gap-2 w-full sm:w-auto font-sans">
                        <input type="text" id="liveSearch" placeholder="Filter Device ID..." class="w-full sm:w-44 bg-gray-900/90 border border-gray-800 focus:border-cyan-500 rounded-lg px-3 py-1.5 text-xs font-mono text-cyan-400 focus:outline-none">
                        <select id="liveStatusFilter" class="bg-gray-900/90 border border-gray-800 focus:border-cyan-500 rounded-lg px-2 py-1.5 text-xs text-gray-300 focus:outline-none font-mono">
                            <option value="all">ALL NODES</option>
                            <option value="active">ACTIVE</option>
                            <option value="expired">EXPIRED</option>
                        </select>
                    </div>
                </div>

                <div id="registryStreamContainer" class="flex-1 overflow-y-auto max-h-[400px] space-y-3 pr-1">
                    <div class="text-center text-xs text-gray-500 py-12">Booting secure live streaming interface...</div>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBpMVq5oNR4IEqy9FuOEbo8zqXx6tiWZCM",
            authDomain: "madarablzr.firebaseapp.com",
            databaseURL: "https://madarablzr-default-rtdb.firebaseio.com",
            projectId: "madarablzr",
            storageBucket: "madarablzr.firebasestorage.app",
            messagingSenderId: "1043305827290",
            appId: "1:1043305827290:android:1357068788acf1e54a4ee3"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Premium UI Notification System
        function triggerAlert(msg, level = 'success') {
            const dock = document.getElementById('toastDock');
            const alertBox = document.createElement('div');
            const colorMap = {
                success: 'border-green-500 text-green-400 bg-gray-950',
                error: 'border-red-500 text-red-400 bg-gray-950',
                info: 'border-cyan-500 text-cyan-400 bg-gray-950'
            };
            alertBox.className = `toast-popup flex items-center gap-2 p-3 rounded-lg text-xs font-mono font-bold border-2 ${colorMap[level]} shadow-2xl backdrop-blur-md`;
            alertBox.innerHTML = `<i data-lucide="radio" class="w-4 h-4 animate-pulse"></i><span>${msg}</span>`;
            
            dock.appendChild(alertBox);
            lucide.createIcons();
            setTimeout(() => {
                alertBox.style.opacity = '0';
                alertBox.style.transform = 'translateY(-10px)';
                alertBox.style.transition = 'all 0.25s ease';
                alertBox.addEventListener('transitionend', () => alertBox.remove());
            }, 2000);
        }

        let databaseMasterCache = {};

        // Async Realtime Stream Core Hook
        onValue(ref(database, 'devices'), (snapshot) => {
            databaseMasterCache = snapshot.exists() ? snapshot.val() : {};
            renderLiveInterface();
        });

        // Dynamic Interval Engine to force status changes visually without refresh
        setInterval(() => {
            if (Object.keys(databaseMasterCache).length > 0) {
                renderLiveInterface();
            }
        }, 1000);

        document.getElementById('liveSearch').addEventListener('input', renderLiveInterface);
        document.getElementById('liveStatusFilter').addEventListener('change', renderLiveInterface);

        // High-Speed Direct Render Engine
        function renderLiveInterface() {
            const wrapper = document.getElementById('registryStreamContainer');
            const filterKey = document.getElementById('liveSearch').value.trim().toUpperCase();
            const filterStatus = document.getElementById('liveStatusFilter').value;

            let countTotal = 0, countActive = 0, countExpired = 0;
            let finalHtml = "";

            const deviceKeys = Object.keys(databaseMasterCache);
            countTotal = deviceKeys.length;

            if (countTotal === 0) {
                wrapper.innerHTML = `<div class="text-center text-xs text-gray-500 py-12 border border-dashed border-gray-800 rounded-xl">NO DEVICES CONNECTED TO DATABASE</div>`;
                updateCounters(0, 0, 0);
                return;
            }

            deviceKeys.forEach(id => {
                const node = databaseMasterCache[id];
                const expDate = new Date(node.validUntil);
                const isAlive = expDate > new Date();

                if (isAlive) countActive++; else countExpired++;

                // Operations Filtration
                if (filterStatus === 'active' && !isAlive) return;
                if (filterStatus === 'expired' && isAlive) return;
                if (filterKey && !id.toUpperCase().includes(filterKey)) return;

                // Live Dynamic Countdown Clock Calculus
                const diffMs = expDate - new Date();
                let clockString = "EXPIRED";
                if (diffMs > 0) {
                    const totalSecs = Math.floor(diffMs / 1000);
                    const hrs = Math.floor(totalSecs / 3600);
                    const mins = Math.floor((totalSecs % 3600) / 60);
                    const secs = totalSecs % 60;
                    clockString = `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                }

                const visualStatusText = isAlive ? "LIVE ACTIVE" : "EXPIRED";
                const colorClass = isAlive ? "status-active" : "status-expired";
                const dotColor = isAlive ? "bg-green-400" : "bg-red-500";

                finalHtml += `
                    <div class="bg-gray-900/40 border border-gray-800 hover:border-gray-700 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all">
                        
                        <div class="space-y-1.5 flex-1 min-w-0">
                            <div class="text-xs font-bold text-cyan-400 flex items-center gap-1.5 select-all truncate">
                                <i data-lucide="smartphone" class="w-3.5 h-3.5 text-gray-500 flex-shrink-0"></i> ${id}
                            </div>
                            <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-gray-400 font-sans">
                                <span class="flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3 text-gray-600"></i> REMAINING: <b class="${colorClass}">${clockString}</b></span>
                                <span class="text-gray-600">|</span>
                                <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3 text-gray-600"></i> EXPIRY: ${expDate.toLocaleString()}</span>
                            </div>
                        </div>

                        <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto pt-3 md:pt-0 border-t border-gray-900 md:border-0 justify-between md:justify-end">
                            
                            <div class="flex items-center gap-1.5 bg-gray-950 px-2.5 py-1 rounded border border-gray-800 text-[10px] font-bold ${colorClass}">
                                <span class="pulse-dot w-1.5 h-1.5 rounded-full ${dotColor}"></span> ${visualStatusText}
                            </div>

                            <div class="flex items-center gap-1 bg-gray-950 p-1 rounded-lg border border-gray-800">
                                <input type="number" id="inputHours-${id}" placeholder="Enter" class="w-14 bg-transparent text-center text-xs font-bold font-mono text-cyan-400 focus:outline-none placeholder-gray-700 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none border-r border-gray-800 pr-1">
                                <select id="unitSelect-${id}" class="bg-gray-900 border-none text-cyan-400 text-[10px] font-bold font-mono focus:outline-none px-1">
                                    <option value="mins">Minutes</option>
                                    <option value="hrs" selected>Hours</option>
                                    <option value="days">Days</option>
                                </select>
                                <button data-id="${id}" class="action-modify-btn bg-cyan-600/20 hover:bg-cyan-600 border border-cyan-500/30 text-cyan-400 hover:text-white px-2 py-1 rounded text-[10px] font-bold transition-all flex items-center gap-0.5">
                                    <i data-lucide="check" class="w-3 h-3"></i> Set
                                </button>
                            </div>

                            <button data-id="${id}" class="action-delete-btn bg-red-950/40 hover:bg-red-600 border border-red-500/20 text-red-400 hover:text-white px-2.5 py-1.5 rounded-lg text-[10px] font-bold transition-all flex items-center gap-0.5">
                                <i data-lucide="trash-2" class="w-3 h-3"></i> CUT
                            </button>
                        </div>

                    </div>
                `;
            });

            wrapper.innerHTML = finalHtml;
            updateCounters(countTotal, countActive, countExpired);
            lucide.createIcons();
            bindOperationTriggers();
        }

        function updateCounters(total, live, dead) {
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statActive').innerText = live;
            document.getElementById('statExpired').innerText = dead;
        }

        // Action Bindings Engine for Time Modifications
        function bindOperationTriggers() {
            document.querySelectorAll('.action-modify-btn').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute('data-id');
                    const hrInput = document.getElementById(`inputHours-${id}`);
                    const unitSelect = document.getElementById(`unitSelect-${id}`);
                    
                    const inputVal = parseInt(hrInput.value);
                    const selectedUnit = unitSelect.value;

                    if (isNaN(inputVal) || inputVal <= 0) {
                        triggerAlert("TYPE VALID VALUE", "error");
                        return;
                    }

                    let calculatedMs = 0;
                    if (selectedUnit === 'mins') {
                        calculatedMs = inputVal * 60 * 1000;
                    } else if (selectedUnit === 'hrs') {
                        calculatedMs = inputVal * 60 * 60 * 1000;
                    } else if (selectedUnit === 'days') {
                        calculatedMs = inputVal * 24 * 60 * 60 * 1000;
                    }

                    const updatedExpiry = new Date();
                    updatedExpiry.setTime(updatedExpiry.getTime() + calculatedMs);

                    try {
                        await set(ref(database, 'devices/' + id), { validUntil: updatedExpiry.toISOString() });
                        triggerAlert("VALIDITY MODIFIED SUCCESSFULLY", "success");
                    } catch (e) {
                        triggerAlert("MODIFICATION REJECTED", "error");
                    }
                };
            });

            document.querySelectorAll('.action-delete-btn').forEach(btn => {
                btn.onclick = async () => {
                    const id = btn.getAttribute('data-id');
                    if (confirm(`TERMINATE DEVICE NODE POOL:\n${id}`)) {
                        try {
                            await remove(ref(database, 'devices/' + id));
                            triggerAlert("DEVICE DELETED FROM POOL", "info");
                        } catch (e) {
                            triggerAlert("OPERATION DISALLOWED", "error");
                        }
                    }
                };
            });
        }

        // New Device Deployment Controller (With full custom Minutes/Hours/Days multiplier)
        document.getElementById('injectionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const idBox = document.getElementById('targetId');
            const valBox = document.getElementById('formValidityValue');
            const unitBox = document.getElementById('formValidityUnit');
            
            const targetDevice = idBox.value.trim().toUpperCase();
            const inputVal = parseInt(valBox.value);
            const selectedUnit = unitBox.value;

            if (!targetDevice || isNaN(inputVal) || inputVal <= 0) {
                triggerAlert("INVALID FORM ENTRIES", "error");
                return;
            }

            // Calculation engine for the inject authorization area
            let calculatedMs = 0;
            if (selectedUnit === 'mins') {
                calculatedMs = inputVal * 60 * 1000;
            } else if (selectedUnit === 'hrs') {
                calculatedMs = inputVal * 60 * 60 * 1000;
            } else if (selectedUnit === 'days') {
                calculatedMs = inputVal * 24 * 60 * 60 * 1000;
            }

            const expiryTime = new Date();
            expiryTime.setTime(expiryTime.getTime() + calculatedMs);

            try {
                await set(ref(database, 'devices/' + targetDevice), { validUntil: expiryTime.toISOString() });
                triggerAlert("NEW NODE DEPLOYED", "success");
                idBox.value = "";
                valBox.value = "";
            } catch (err) {
                triggerAlert("DEPLOYMENT FAILS", "error");
            }
        });

        lucide.createIcons();
    </script>
</body>
</html>
